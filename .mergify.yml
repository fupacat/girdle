pull_request_rules:
  - name: TEMP diagnostic - label any open PR
    # Temporary: verifies the rule engine executes actions at all
    # (independent of Dependabot-specific conditions), since Dependabot PRs
    # haven't shown any automatic rule action despite repeated refreshes.
    # Must be merged to master to actually run - Mergify reads .mergify.yml
    # from the default branch, not a PR's own head branch, so this can't
    # be tested from within the PR that adds it. Remove once diagnosed.
    conditions:
      - -closed
      - label!=mergify-engine-test
    actions:
      label:
        add:
          - mergify-engine-test

  - name: keep safe Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete. Ask Dependabot to rebase its own branch rather
    # than using Mergify's `update` action (which pushes a merge commit
    # authored by Mergify) - Dependabot stops managing a branch once it
    # sees a commit from someone else, losing its own auto-rebase/
    # conflict-resolution/version-refresh behavior. Scoped to the same
    # patch/minor/security types the merge rule covers, so major bumps
    # held for manual review aren't churned with pointless rebases/CI runs.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      comment:
        message: "@dependabot rebase"

  - name: auto-approve safe Dependabot updates
    # master's ruleset requires 1 approving review. Mergify auto-approving
    # (the pattern Mergify's own Dependabot integration docs recommend)
    # satisfies that legitimately, rather than needing to bypass the
    # review requirement entirely.
    conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      review:
        type: APPROVE

  - name: auto-merge safe Dependabot updates
    # Patch/minor/security bumps are low-risk; queue them once the test job
    # passes. Uses Mergify's own bot identity to merge (a real actor, not
    # GITHUB_TOKEN), so downstream workflows and required-status-check
    # events fire normally on the commit it produces - unlike a
    # hand-rolled GITHUB_TOKEN-based auto-merge, which GitHub silently
    # won't chain. Requires commits-behind=0 so this doesn't repeatedly
    # attempt (and fail) merges while the rule above is still waiting on
    # Dependabot's rebase.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - check-success=test
      - "#commits-behind=0"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      queue:
        name: Dependabot

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - leave them for a human
    # to look at and merge explicitly, rather than auto-merging.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review
queue_rules:
  - name: Dependabot
    # branch_protection_injection_mode: none means this queue's own
    # merge_conditions are authoritative instead of auto-inheriting every
    # check master's ruleset requires - listed explicitly below instead.
    # The required-review requirement isn't listed here: Mergify rejects
    # github-review-approved/github-code-owner-review-satisfied as direct
    # conditions ("evaluated internally, cannot be used in conditions") -
    # instead the "auto-approve safe Dependabot updates" pull_request_rule
    # above satisfies the real GitHub requirement before this queue's
    # merge attempt runs.
    branch_protection_injection_mode: none
    queue_conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
merge_queue:
  max_parallel_checks: 7
