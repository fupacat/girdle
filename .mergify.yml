pull_request_rules:
  - name: keep safe Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete. Ask Dependabot to rebase its own branch rather
    # than using Mergify's `update` action (which pushes a merge commit
    # authored by Mergify) - Dependabot stops managing a branch once it
    # sees a commit from someone else, losing its own auto-rebase/
    # conflict-resolution/version-refresh behavior. Scoped to the same
    # patch/minor/security types the merge rule covers, so major bumps
    # held for manual review aren't churned with pointless rebases/CI runs.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      comment:
        message: "@dependabot rebase"

  - name: auto-approve safe Dependabot updates
    # master's ruleset requires 1 approving review. Mergify auto-approving
    # (the pattern Mergify's own Dependabot integration docs recommend)
    # satisfies that legitimately, rather than needing to bypass the
    # review requirement entirely.
    conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      review:
        type: APPROVE

  - name: queue Dependabot updates
    # Entry stays scoped to patch/minor/security - not just author is
    # dependabot - since without this filter, a major bump could sit
    # unapproved (matching the queue) until any reviewer approves it for
    # any reason during review, at which point the queue would silently
    # auto-merge it with no explicit merge step, undermining "label major
    # bumps for manual review". Master's full ruleset (test, SonarCloud,
    # Gitar, 1 approving review) is what actually gates the merge, via
    # the queue rule's branch_protection_injection_mode: merge - not a
    # hand-picked subset duplicated here, and not something blocking
    # queue entry either. Uses Mergify's own bot identity to merge (a
    # real actor, not GITHUB_TOKEN), so downstream workflows and
    # required-status-check events fire normally on the commit it
    # produces.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      queue:
        name: Dependabot

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - flag them for a
    # reviewer to actually read the release notes and weigh them against
    # how the dependency is used here, rather than a blanket
    # auto-approve. See "queue major Dependabot updates pending review"
    # below for how they merge once that real review lands.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review

  - name: queue major Dependabot updates pending review
    # Unlike the patch/minor/security rule above, this does NOT
    # auto-approve - #approved-reviews-by>=1 has to come from an actual
    # reviewer (Gitar, Copilot, or a human) reading the major version's
    # release notes against this repo's actual usage, not Mergify
    # rubber-stamping it. Gated here at queue *entry*, not left to
    # merge_conditions: Mergify's queues form one ordered train across
    # every queue_rules entry, not independent parallel queues - an
    # unapproved PR sitting in Dependabot-major (which ranks ahead of
    # default) would block every PR behind it queue-wide, indefinitely,
    # since nothing times out a PR still waiting on review. Requiring
    # the approval before entry means this queue only ever holds PRs
    # that are already realistically about to merge - see
    # Dependabot-major's checks_timeout for why a bounded wait is safe
    # again once entry already implies a real review happened.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - dependabot-update-type=version-update:semver-major
      - "#approved-reviews-by>=1"
    actions:
      queue:
        name: Dependabot-major

  - name: queue development PRs
    # Non-Dependabot PRs (human-authored, or agent-authored like this
    # session's own ci/* branches) already get Gitar/SonarCloud checks
    # natively on their own branch - confirmed repeatedly tonight (#37,
    # #39, #47 all showed both checks directly, no draft-PR workaround
    # needed). So this queue uses default branch_protection_injection_mode
    # (queue) rather than the Dependabot queue's none/merge_bot_account/
    # max_checks_retries setup - master's full ruleset auto-injects into
    # both queue_conditions and merge_conditions, no special-casing
    # needed. Excludes dependabot[bot] (has its own queue above).
    conditions:
      - author!=dependabot[bot]
      - -conflict
      - -draft
    actions:
      queue:
        name: default
queue_rules:
  - name: Dependabot
    # branch_protection_injection_mode: merge - the default ("queue")
    # injects master's ruleset into BOTH queue entry and the merge gate,
    # which meant a Dependabot PR couldn't even enter the queue until
    # Gitar/SonarCloud/review were satisfied (confirmed live: "Waiting
    # for queue conditions" listed all three, stuck at the "Enter queue"
    # step). "merge" injects the ruleset only at the merge gate, so entry
    # stays governed purely by queue_conditions below - and once queued,
    # Mergify tests the PR on its own mergify/merge-queue/* branch under
    # its own identity, which may get Gitar/SonarCloud to actually run
    # where they don't on the PR's own branch (untested until now - see
    # PR history for what actually happened). This also means no
    # merge_bot_account is needed - Mergify merges under its own identity
    # once the real ruleset is satisfied.
    branch_protection_injection_mode: merge
    queue_conditions:
      - author=dependabot[bot]
      - -conflict
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
      - check-success=Gitar
      - "#approved-reviews-by>=1"

  - name: Dependabot-major
    # Same draft_pr/merge_bot_account setup as the Dependabot queue
    # above (major bumps have the same Gitar/SonarCloud-don't-run-on-
    # Dependabot's-own-branch problem). #approved-reviews-by>=1 is
    # required at entry (queue_conditions), not just the merge gate -
    # Mergify's queues form one ordered train across every queue_rules
    # entry, so an unapproved PR sitting here (ranked ahead of default)
    # would otherwise block every PR behind it, queue-wide, with no
    # timeout to clear it (caught live by Gitar's review on #58). No
    # auto-approve rule feeds this condition (see "queue major
    # Dependabot updates pending review"), so entry only happens once a
    # real reviewer has actually looked at the release notes - which
    # means checks_timeout can go back to a CI-scaled bound like the
    # Dependabot queue's, since by the time a PR is here CI is the only
    # thing left to wait on. Kept in merge_conditions too as a safety
    # net: Dependabot could still push a new commit within the same
    # major line after entry, and dismiss_stale_reviews_on_push would
    # dismiss the approval that got it in. -conflict is also in
    # queue_conditions explicitly (not just relying on the pull_request_
    # rule's one-shot entry check): a PR that's conflict-free when the
    # queue action first fires can become conflicting later, once other
    # PRs ahead of it in the train merge - queue_conditions is what
    # Mergify re-evaluates continuously to decide whether a PR stays
    # eligible, so this is what actually catches that case.
    branch_protection_injection_mode: none
    merge_bot_account: fupacat
    max_checks_retries: 1
    checks_timeout: 30m
    queue_conditions:
      - author=dependabot[bot]
      - -conflict
      - dependabot-update-type=version-update:semver-major
      - "#approved-reviews-by>=1"
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
      - check-success=Gitar
      - "#approved-reviews-by>=1"

  - name: default
    # Default branch_protection_injection_mode (queue): master's full
    # ruleset auto-injects into both queue_conditions and
    # merge_conditions, no explicit list or merge_bot_account needed -
    # unlike the Dependabot queue, checks genuinely run on these PRs'
    # own branches, so there's no in-place/trusted-vs-draft distinction
    # to work around. Copilot PRs route through here too now -
    # auto-merge-copilot.yml no longer arms GitHub's native auto-merge
    # (it can't bypass the ruleset either), just promotes out of draft
    # and lets this queue handle the actual merge.
    queue_conditions:
      - author!=dependabot[bot]
      - -conflict
merge_queue:
  max_parallel_checks: 7
