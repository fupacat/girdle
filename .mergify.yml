pull_request_rules:
  - name: enable Gitar auto-apply on all PRs
    # Gitar's CI-failure auto-fix (build/test/lint/flaky-test) is opt-in
    # per PR, not a global default - it activates via either a PR comment
    # (`gitar auto-apply:on`) or the `gitar-managed` label. Applying the
    # label here on every PR is what makes fix automation actually
    # blanket instead of needing a manual step per PR. Gitar's own
    # auto-merge is deliberately never enabled (no .gitar/config/merge.md
    # exists) - Mergify remains the only thing that merges, so this only
    # reaches into the fix loop, not the merge decision. Excludes
    # dependabot[bot]: a Gitar auto-fix commit pushed onto a Dependabot
    # PR's branch is "a commit from someone else" - the same condition
    # that makes Dependabot stop auto-managing the branch (losing its own
    # rebase/conflict-resolution/version-refresh behavior), documented on
    # the rebase rule below.
    conditions:
      - -closed
      - author!=dependabot[bot]
    actions:
      label:
        add:
          - gitar-managed

  - name: keep safe Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete. Ask Dependabot to rebase its own branch rather
    # than using Mergify's `update` action (which pushes a merge commit
    # authored by Mergify) - Dependabot stops managing a branch once it
    # sees a commit from someone else, losing its own auto-rebase/
    # conflict-resolution/version-refresh behavior. Scoped to the same
    # patch/minor/security types the merge rule covers, so major bumps
    # held for manual review aren't churned with pointless rebases/CI runs.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=version-update:semver-major
          - dependabot-update-type=security
    actions:
      comment:
        message: "@dependabot rebase"

  - name: auto-approve safe Dependabot updates
    # master's ruleset requires 1 approving review. Mergify auto-approving
    # (the pattern Mergify's own Dependabot integration docs recommend)
    # satisfies that legitimately, rather than needing to bypass the
    # review requirement entirely.
    conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      review:
        type: APPROVE

  - name: queue Dependabot updates
    # Entry stays scoped to patch/minor/security - not just author is
    # dependabot - since without this filter, a major bump could sit
    # unapproved (matching the queue) until any reviewer approves it for
    # any reason during review, at which point the queue would silently
    # auto-merge it with no explicit merge step, undermining "label major
    # bumps for manual review". Master's full ruleset (test, SonarCloud,
    # Gitar, 1 approving review) is what actually gates the merge, via
    # the queue rule's branch_protection_injection_mode: merge - not a
    # hand-picked subset duplicated here, and not something blocking
    # queue entry either. Uses Mergify's own bot identity to merge (a
    # real actor, not GITHUB_TOKEN), so downstream workflows and
    # required-status-check events fire normally on the commit it
    # produces.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      queue:
        name: Dependabot

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - leave them for a human
    # to look at and merge explicitly, rather than auto-merging.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review

  - name: queue major Dependabot updates pending review
    # Major bumps still need to go through the merge queue once approved
    # (labeled above for a human to look at) - approval is required at
    # queue entry, not just at merge, so an unapproved major can't sit in
    # the train blocking the Dependabot/default queues behind it.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - dependabot-update-type=version-update:semver-major
      - "#approved-reviews-by>=1"
    actions:
      queue:
        name: Dependabot-major

  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind>=1"
      - author!=dependabot[bot]
    actions:
      update: null

  - name: queue development PRs
    # Non-Dependabot PRs (human-authored, or agent-authored like this
    # session's own ci/* branches) already get Gitar/SonarCloud checks
    # natively on their own branch - confirmed repeatedly tonight (#37,
    # #39, #47 all showed both checks directly, no draft-PR workaround
    # needed). So this queue uses default branch_protection_injection_mode
    # (queue) rather than the Dependabot queue's none/merge_bot_account/
    # max_checks_retries setup - master's full ruleset auto-injects into
    # both queue_conditions and merge_conditions, no special-casing
    # needed. Excludes dependabot[bot] (has its own queue above).
    conditions:
      - author!=dependabot[bot]
      - -conflict
      - -draft
      # Excludes "light" PRs (routed to the light queue below) - docs
      # (.agent-vault/, *.md) or CI config (.github/workflows/,
      # .mergify.yml) only. Any changed file outside those means this
      # could affect pytest/SonarCloud, so it needs the full queue.
      - files ~= ^(?!(\.agent-vault/|.*\.md$|\.github/workflows/(?!ci\.yml$)|\.mergify\.yml$)).*$
    actions:
      queue:
        name: default

  - name: queue light (docs/CI-config-only) PRs
    # Every changed file must fall under .agent-vault/, end in .md
    # (README/CONTRIBUTING/the PR template all end in .md too), be under
    # .github/workflows/, or be .mergify.yml itself. Originally
    # docs-only; broadened to cover CI-config changes too rather than a
    # separate queue, since a mutually-exclusive docs-only/ci-only split
    # left a gap - a PR touching both a doc file and .mergify.yml (a
    # pattern this repo's own PRs have used) matched neither queue and
    # would never get queued at all. One combined "light" category with
    # a single condition avoids that. A PR that touches even one file
    # outside these patterns falls through to "queue development PRs"
    # above instead, since it could affect pytest/SonarCloud results
    # this queue's lighter gate never checks. See
    # .agent-vault/ci/documentation-only-queue-design.md for the full
    # rationale (motivated by
    # .agent-vault/ci/queue-entry-cost-and-timeouts.md's finding that the
    # full ruleset - and its SonarQube scan - was gating even doc-only
    # PRs like this repo's own vault-note PRs).
    conditions:
      - author!=dependabot[bot]
      - -conflict
      - -draft
      - -files ~= ^(?!(\.agent-vault/|.*\.md$|\.github/workflows/(?!ci\.yml$)|\.mergify\.yml$)).*$
    actions:
      queue:
        name: light

  - name: nudge Copilot when a PR goes into conflict
    # Copilot's own PRs pile up behind each other and drift into conflict
    # with master as earlier ones merge - the "Keep PRs up to date" rule
    # above can't fix that (a real diff conflict, not just a stale branch),
    # and dequeuing wasn't resolving it either. Mergify already recomputes
    # `conflict` reactively off GitHub's webhooks, so this reacts within
    # seconds rather than needing a polling workflow. Copilot coding agent
    # watches for @-mentions on PRs it authored and pushes fix commits in
    # response, including conflict resolution - but per GitHub's own docs,
    # "Copilot only responds to comments from people who have write access
    # to the repository," and mergify[bot]'s own App identity doesn't count
    # (confirmed live: an identical @copilot mention posted as mergify[bot]
    # sat ignored for 16+ minutes on PRs #93/#98/#100, while the same text
    # posted by a human got a real fix commit in ~3.5 minutes). bot_account
    # impersonates a real collaborator account so the mention actually
    # reaches Copilot. TODO(backlog): replace with a dedicated automation
    # user account (e.g. girdle-automation) once one is provisioned and
    # authorized in Mergify, so these nudges don't read as Eric personally
    # asking each time - deferred for now. A label prevents duplicate nudges
    # while the PR remains conflicted; it is cleared after the conflict is
    # resolved so a later re-conflict can trigger another nudge. The hidden
    # marker records the head commit SHA for context.
    conditions:
      - conflict
      - author=Copilot
      - -label=conflict-nudged
      - -closed
      - -draft
    actions:
      comment:
        bot_account: fupacat
        message: |-
          @copilot This PR has a merge conflict with `master`. Please rebase
          onto the latest `master` and resolve the conflicting changes.
          <!-- conflict-nudge:{{head.sha}} -->
      label:
        add:
          - conflict-nudged

  - name: clear conflict-nudged label once resolved
    conditions:
      - label=conflict-nudged
      - -conflict
    actions:
      label:
        remove:
          - conflict-nudged
queue_rules:
  - name: Dependabot
    # branch_protection_injection_mode: merge - the default ("queue")
    # injects master's ruleset into BOTH queue entry and the merge gate,
    # which meant a Dependabot PR couldn't even enter the queue until
    # Gitar/SonarCloud/review were satisfied (confirmed live: "Waiting
    # for queue conditions" listed all three, stuck at the "Enter queue"
    # step). "merge" injects the ruleset only at the merge gate, so entry
    # stays governed purely by queue_conditions below - and once queued,
    # Mergify tests the PR on its own mergify/merge-queue/* branch under
    # its own identity, which may get Gitar/SonarCloud to actually run
    # where they don't on the PR's own branch (untested until now - see
    # PR history for what actually happened). This also means no
    # merge_bot_account is needed - Mergify merges under its own identity
    # once the real ruleset is satisfied.
    branch_protection_injection_mode: merge
    max_checks_retries: 1
    checks_timeout: 30m
    queue_conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
      - check-success=Gitar
      - "#approved-reviews-by>=1"

  - name: Dependabot-major
    # Same branch_protection_injection_mode: merge rationale as the
    # Dependabot queue above - entry stays governed by queue_conditions
    # only, and Mergify's own draft-PR mechanism gets Gitar/SonarCloud to
    # run. Approval is required at queue_conditions (not just
    # merge_conditions) so an unapproved major never enters the train and
    # blocks the queues behind it.
    branch_protection_injection_mode: merge
    max_checks_retries: 1
    checks_timeout: 30m
    queue_conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
      - "#approved-reviews-by>=1"
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
      - check-success=Gitar
      - "#approved-reviews-by>=1"

  - name: default
    # Default branch_protection_injection_mode (queue): master's full
    # ruleset auto-injects into both queue_conditions and
    # merge_conditions, no explicit list or merge_bot_account needed -
    # unlike the Dependabot queue, checks genuinely run on these PRs'
    # own branches, so there's no in-place/trusted-vs-draft distinction
    # to work around. Copilot PRs route through here too now -
    # auto-merge-copilot.yml no longer arms GitHub's native auto-merge
    # (it can't bypass the ruleset either), just promotes out of draft
    # and lets this queue handle the actual merge.
    #
    # batch_size: throughput only. NOTE: this does NOT address the stuck
    # -conflict evaluation (see .agent-vault/ci/merge-pipeline.md) - that
    # condition lives in the 'queue development PRs' pull_request_rule and
    # gates queue *entry*; batching only applies to PRs already queued.
    batch_size: 3
    batch_max_wait_time: "2 minutes"
    queue_conditions:
      - author!=dependabot[bot]

  - name: light
    # Routes here only when every changed file is docs or CI config (see
    # the "queue light (docs/CI-config-only) PRs" pull_request_rule) -
    # nothing in that diff can affect pytest or SonarCloud's analysis
    # (SonarCloud only scans sonar.sources=src/sonar.tests=tests per
    # sonar-project.properties; a YAML/markdown-only diff can't touch
    # either), so this queue doesn't require either. Deliberately not
    # split into separate docs/ci-config queues - see the pull_request_rule
    # comment for the mutual-exclusion gap that split would reintroduce.
    # branch_protection_injection_mode: none keeps this queue from inheriting
    # impossible queue-only requirements from master's ruleset; queue
    # admission/merge is gated only by the explicit merge_conditions below.
    # CI still reports SonarCloud on PRs so the protected-branch required
    # check is satisfied when GitHub performs the final merge.
    branch_protection_injection_mode: none
    checks_timeout: 15m
    queue_conditions:
      - author!=dependabot[bot]
    merge_conditions:
      - check-success=test
      - check-success=Gitar
      - "#approved-reviews-by>=1"
merge_queue:
  max_parallel_checks: 7
merge_protections_settings:
  auto_merge_conditions: true
