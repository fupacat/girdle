pull_request_rules:
  - name: keep Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete - do it automatically instead of relying on a
    # manual @dependabot rebase each time.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
    actions:
      update:

  - name: auto-merge safe Dependabot updates
    # Patch/minor/security bumps are low-risk; merge them once the test job
    # passes. Uses the plain `merge` action, not `queue` (Mergify's
    # batching/merge-train feature) - queue requires activating "Merge
    # Queue" as a separate product on Mergify's dashboard, which this repo
    # doesn't have enabled, and we don't need batching here anyway. `merge`
    # still performs the merge under Mergify's own bot identity (a real
    # actor, not GITHUB_TOKEN), so downstream workflows and
    # required-status-check events fire normally on the commit it
    # produces - unlike a hand-rolled GITHUB_TOKEN-based auto-merge, which
    # GitHub silently won't chain.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - check-success=test
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      merge:
        method: squash

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - leave them for a human
    # to look at and merge explicitly, rather than auto-merging.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review
