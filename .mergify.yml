pull_request_rules:
  - name: keep safe Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete. Ask Dependabot to rebase its own branch rather
    # than using Mergify's `update` action (which pushes a merge commit
    # authored by Mergify) - Dependabot stops managing a branch once it
    # sees a commit from someone else, losing its own auto-rebase/
    # conflict-resolution/version-refresh behavior. Scoped to the same
    # patch/minor/security types the merge rule covers, so major bumps
    # held for manual review aren't churned with pointless rebases/CI runs.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      comment:
        message: "@dependabot rebase"

  - name: auto-approve safe Dependabot updates
    # master's ruleset requires 1 approving review. Mergify auto-approving
    # (the pattern Mergify's own Dependabot integration docs recommend)
    # satisfies that legitimately, rather than needing to bypass the
    # review requirement entirely.
    conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      review:
        type: APPROVE

  - name: queue Dependabot updates
    # Entry stays scoped to patch/minor/security - not just author is
    # dependabot - since without this filter, a major bump could sit
    # unapproved (matching the queue) until any reviewer approves it for
    # any reason during review, at which point the queue would silently
    # auto-merge it with no explicit merge step, undermining "label major
    # bumps for manual review". test/SonarCloud/review gate the actual
    # merge (see the queue rule's merge_conditions for why Gitar is
    # deliberately excluded there). Uses Mergify's own bot identity to
    # merge (a real actor, not GITHUB_TOKEN), so downstream workflows and
    # required-status-check events fire normally on the commit it
    # produces.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      queue:
        name: Dependabot

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - leave them for a human
    # to look at and merge explicitly, rather than auto-merging.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review
queue_rules:
  - name: Dependabot
    # Confirmed live (PR #23 -> speculative PR #38): Mergify's queue tests
    # each Dependabot PR on its own mergify/merge-queue/* branch, authored
    # as `mergify` rather than `dependabot[bot]` - and SonarCloud Code
    # Analysis and test both actually ran and passed there, where they
    # never do on the PR's own branch. Gitar still didn't fire even after
    # several minutes (everything else landed within ~2) - PR #38 is a
    # draft PR, and Gitar likely skips draft PRs specifically, separate
    # from any dependabot[bot]-author exclusion. Auto-injecting Gitar into
    # merge_conditions (branch_protection_injection_mode: merge, the
    # previous setup) therefore left the queue permanently stuck at 3/4
    # conditions - ruleset bypass_actors doesn't help here either, since
    # Mergify's own queue engine waits for its internal copy of each
    # condition regardless of whether it could bypass the final merge
    # call. branch_protection_injection_mode: none plus explicit
    # merge_conditions below deliberately excludes Gitar - the one
    # requirement genuinely unsatisfiable through this queue - while
    # keeping test/SonarCloud/review, which are all confirmed working.
    # Needs merge_bot_account since injection_mode is none; now viable
    # because Mergify (app id 10562) has ruleset bypass permission.
    branch_protection_injection_mode: none
    merge_bot_account: mergify[bot]
    queue_conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    merge_conditions:
      - check-success=test
      - check-success=SonarCloud Code Analysis
      - "#approved-reviews-by>=1"
merge_queue:
  max_parallel_checks: 7
