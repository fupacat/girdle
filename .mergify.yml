pull_request_rules:
  - name: keep safe Dependabot PRs up to date with master
    # master's ruleset requires strict status checks (branch must be
    # current before merge), so a Dependabot PR that sits for a while
    # behind other merges needs updating or the merge rule below can never
    # actually complete. Ask Dependabot to rebase its own branch rather
    # than using Mergify's `update` action (which pushes a merge commit
    # authored by Mergify) - Dependabot stops managing a branch once it
    # sees a commit from someone else, losing its own auto-rebase/
    # conflict-resolution/version-refresh behavior. Scoped to the same
    # patch/minor/security types the merge rule covers, so major bumps
    # held for manual review aren't churned with pointless rebases/CI runs.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - "#commits-behind>=1"
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      comment:
        message: "@dependabot rebase"

  - name: auto-approve safe Dependabot updates
    # master's ruleset requires 1 approving review. Mergify auto-approving
    # (the pattern Mergify's own Dependabot integration docs recommend)
    # satisfies that legitimately, rather than needing to bypass the
    # review requirement entirely.
    conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      review:
        type: APPROVE

  - name: queue Dependabot updates
    # Entry stays scoped to patch/minor/security - not just author is
    # dependabot - since without this filter, a major bump could sit
    # unapproved (matching the queue) until any reviewer approves it for
    # any reason during review, at which point the queue would silently
    # auto-merge it with no explicit merge step, undermining "label major
    # bumps for manual review". The queue rule below still uses default
    # branch_protection_injection_mode, so master's full ruleset (test,
    # SonarCloud, Gitar, 1 approving review) is what actually gates the
    # merge - not a hand-picked subset duplicated here. Uses Mergify's own
    # bot identity to merge (a real actor, not GITHUB_TOKEN), so
    # downstream workflows and required-status-check events fire normally
    # on the commit it produces.
    conditions:
      - author=dependabot[bot]
      - -conflict
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
    actions:
      queue:
        name: Dependabot

  - name: label major Dependabot updates for manual review
    # Major bumps carry real breaking-change risk - leave them for a human
    # to look at and merge explicitly, rather than auto-merging.
    conditions:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    actions:
      label:
        add:
          - dependency-major-review
queue_rules:
  - name: Dependabot
    # Default branch_protection_injection_mode (not "none"): master's full
    # ruleset (test, SonarCloud, Gitar, 1 approving review) is injected
    # automatically as this queue's real merge requirement, instead of a
    # hand-picked subset. This also means no merge_bot_account is needed -
    # Mergify merges under its own identity once the actual ruleset is
    # satisfied. Note Gitar and SonarCloud don't run on Dependabot-authored
    # PRs at all (confirmed separately), so as configured this queue will
    # wait indefinitely on those two checks for a genuine Dependabot PR -
    # a real gap, not something this config alone resolves. Scoped to
    # patch/minor/security to match the "queue Dependabot updates" rule
    # that's the only thing invoking this queue - see that rule's comment
    # for why majors are excluded here too, not just at entry.
    queue_conditions:
      - author=dependabot[bot]
      - or:
          - dependabot-update-type=version-update:semver-patch
          - dependabot-update-type=version-update:semver-minor
          - dependabot-update-type=security
merge_queue:
  max_parallel_checks: 7
