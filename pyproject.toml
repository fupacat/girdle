[project]
name = "girdle"
version = "0.1.0"
description = "Agent-readiness scanner: scores repos on verification infrastructure (tests/lint/CI/reproducibility) across common language ecosystems. Agent-first CLI (JSON), with an HTML dashboard rendered from the same data."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
]

[project.scripts]
girdle = "girdle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
girdle = ["templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
