name: "Copilot Setup Steps"

# Bootstraps the Copilot coding agent's sandbox before it starts working on
# an assigned issue. Without this, the agent runs plain `git commit` with
# no local hooks active at all. This still matters for in-sandbox manual
# checks (`pre-commit run`, `ruff`, `pytest`, etc.), but Copilot-authored
# commits are not guaranteed to be created via local `git commit`, so local
# hooks are not a reliable enforcement gate for those commits. CI remains
# the authoritative fail-closed gate before merge.
#
# The job name is load-bearing: GitHub only picks this workflow up for
# Copilot's sandbox if the job is named exactly `copilot-setup-steps`.
# `on:` is for manual verification only (`gh workflow run` / editing this
# file) - it doesn't gate whether Copilot itself invokes it.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pre-commit install
