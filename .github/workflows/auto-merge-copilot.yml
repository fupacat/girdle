name: Auto-merge Copilot PRs

# Promotes Copilot coding agent PRs out of draft so Mergify can queue them.
# Required checks and review are enforced by the default branch ruleset;
# Mergify handles merging once its queue conditions are met.
# Safe to call repeatedly (idempotent): re-running just re-asserts the same
# ready-for-review state.
#
# Two independent paths to the same outcome:
#
# 1. Reactive (auto-merge job): triggers on review_requested/ready_for_review,
#    NOT opened/synchronize - opened fires on Copilot's very first,
#    often-empty "Initial plan" commit, and synchronize fires on every
#    intermediate push while it's still mid-task. review_requested is
#    usually the signal Copilot's coding agent itself emits once it
#    considers a round of work done (it requests review from whoever
#    assigned the issue). ready_for_review is also handled so a
#    manually-promoted PR still gets auto-merge armed.
#
# 2. CI-driven promotion (fallback-sweep job): when the repository CI run
#    completes on the current head, promote Copilot drafts only if all required
#    checks on that head are green, the diff is non-empty, there is no merge
#    conflict, and the PR is not labelled manual or repair:cap. The schedule
#    remains as a fallback for any draft PR that missed the workflow_run event.

on:
  pull_request:
    types: [review_requested, ready_for_review, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.user.login == 'Copilot' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-copilot-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark ready for review
        if: github.event.pull_request.draft == true
        run: |
          set -euo pipefail

          pr_number="${{ github.event.pull_request.number }}"
          pr_json=$(gh pr view "$pr_number" --json state,changedFiles,commits)
          pr_state=$(jq -r '.state' <<<"$pr_json")
          changed_files=$(jq -r '.changedFiles // 0' <<<"$pr_json")
          commit_count=$(jq -r '.commits | length' <<<"$pr_json")
          first_headline=$(jq -r '.commits[0].messageHeadline // ""' <<<"$pr_json")
          initial_plan_pattern='^initial[[:space:]]+plan([[:space:]:-].*)?$'

          if [ "$changed_files" -eq 0 ]; then
            if [ "$commit_count" -eq 1 ] \
              && printf '%s' "$first_headline" | grep -qiE "$initial_plan_pattern"; then
              echo "Skipping PR #$pr_number: only initial-plan commit and 0 changed files."
            else
              echo "Skipping PR #$pr_number: 0 changed files."
            fi
            exit 0
          fi

          if ! gh pr ready "$pr_number"; then
            pr_state=$(gh pr view "$pr_number" --json state -q '.state' || true)
            if [ "$pr_state" = "CLOSED" ] || [ "$pr_state" = "MERGED" ]; then
              echo "PR #$pr_number is $pr_state; skipping ready-for-review."
              exit 0
            fi
            echo "Failed to mark PR #$pr_number ready (state=${pr_state:-unknown})." >&2
            exit 1
          fi

  fallback-sweep:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-copilot-fallback-sweep
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: >-
          Promote Copilot drafts only when required checks are green,
          the diff is non-empty, and there is no conflict
        run: |
          set -euo pipefail

          default_branch=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          repo_owner="${GH_REPO%%/*}"

          json_fields="number,author,headRefName,isDraft,baseRefName,headRepositoryOwner,title"
          jq_filter='.[]
            | select(.isDraft == true)
            | select(.author.login == "Copilot")
            | select(.headRefName | startswith("copilot/"))
            | select(.title | test("^\\[WIP\\]") | not)
            | [.number, .baseRefName, .headRepositoryOwner.login]
            | @tsv'

          gh pr list --state open --draft --limit 500 --json "$json_fields" -q "$jq_filter" \
          | while IFS=$'\t' read -r pr base_ref head_owner; do
              if [ "$base_ref" != "$default_branch" ] || [ "$head_owner" != "$repo_owner" ]; then
                echo "Skipping PR #$pr (base=$base_ref, head owner=$head_owner)"
                continue
              fi

              pr_fields=number,isDraft,baseRefName,headRepositoryOwner,mergeable,labels,commits,
              pr_fields+=changedFiles,statusCheckRollup
              pr_json=$(gh pr view "$pr" --json "$pr_fields")
              label_names=$(jq -r '.labels[].name // empty' <<<"$pr_json")
              if printf '%s\n' "$label_names" | grep -qx 'manual' || \
                printf '%s\n' "$label_names" | grep -qx 'repair:cap'; then
                echo "Skipping PR #$pr: label blocklist applied."
                continue
              fi

              changed_files=$(jq -r '.changedFiles // 0' <<<"$pr_json")
              commit_count=$(jq -r '.commits | length' <<<"$pr_json")
              first_headline=$(jq -r '.commits[0].messageHeadline // ""' <<<"$pr_json")
              initial_plan_pattern='^initial[[:space:]]+plan([[:space:]:-].*)?$'

              if [ "$changed_files" -eq 0 ]; then
                if [ "$commit_count" -eq 1 ] \
                  && printf '%s' "$first_headline" | grep -qiE "$initial_plan_pattern"; then
                  echo "Skipping PR #$pr: only initial-plan commit and 0 changed files."
                else
                  echo "Skipping PR #$pr: 0 changed files."
                fi
                continue
              fi

              if [ "$(jq -r '.mergeable // empty' <<<"$pr_json")" != "MERGEABLE" ]; then
                echo "Skipping PR #$pr: merge conflict or mergeability not yet resolved."
                continue
              fi

              required_checks=$(jq -r '
                .statusCheckRollup[]?
                | [.name, .status, .conclusion]
                | @tsv' <<<"$pr_json")
              if [ -z "$required_checks" ]; then
                echo "Skipping PR #$pr: no required checks reported yet."
                continue
              fi

              failed_required=0
              while IFS=$'\t' read -r check_name check_status check_conclusion; do
                [ -n "$check_name" ] || continue
                if [ "$check_status" != "COMPLETED" ] || \
                  [ "$check_conclusion" != "SUCCESS" ]; then
                  echo "Skipping PR #$pr: required check " \
                    "${check_name} is ${check_status}/${check_conclusion}."
                  failed_required=1
                  break
                fi
              done <<< "$required_checks"
              if [ "$failed_required" -ne 0 ]; then
                continue
              fi

              echo "Promoting PR #$pr out of draft"
              if ! gh pr ready "$pr"; then
                pr_state=$(gh pr view "$pr" --json state -q '.state' || true)
                if [ "$pr_state" = "CLOSED" ] || [ "$pr_state" = "MERGED" ]; then
                  echo "PR #$pr is $pr_state; skipping ready-for-review."
                  continue
                fi
                echo "Failed to mark PR #$pr ready " \
                  "(state=${pr_state:-unknown})." >&2
                exit 1
              fi
            done
