name: Auto-merge Copilot PRs

# Promotes Copilot coding agent PRs out of draft and arms GitHub's native
# auto-merge, then gets out of the way - all real gating (required checks,
# required review) is enforced by branch protection on the default branch
# and GitHub's own auto-merge mechanism, not by this workflow's own logic.
# Safe to call repeatedly (idempotent): re-running on a new push just
# re-asserts the same two states.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'Copilot' &&
      startsWith(github.event.pull_request.head.ref, 'copilot/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark ready for review
        if: github.event.pull_request.draft == true
        run: gh pr ready "${{ github.event.pull_request.number }}"
      - name: Enable auto-merge (squash)
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash
