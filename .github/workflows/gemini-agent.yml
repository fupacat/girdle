name: Gemini Coding Agent (OpenRouter)

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to address'
        required: true
        type: string
      instructions:
        description: 'Specific instructions or prompt'
        required: false
        type: string

# Read-only by default. The job that runs the model has no write access at
# all; the publisher job (below) has no model key. Neither holds both.
permissions:
  contents: read

jobs:
  # Job 1 - runs the LLM. Holds OPENROUTER_API_KEY but only a read-only
  # GITHUB_TOKEN and no persisted git credentials, so a prompt-injected run
  # cannot push or open anything. Its only output is a patch artifact.
  gemini-agent:
    outputs:
      issue_num: ${{ steps.prompt.outputs.issue_num }}
      checks: ${{ steps.hygiene.outputs.checks }}
      has_changes: ${{ steps.patch.outputs.has_changes }}
    # Trigger when labeled 'agent:gemini', commented with '@gemini', or dispatched manually
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@gemini') &&
        !github.event.issue.pull_request &&
        contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association
        )
      ) ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:gemini')
    # One run per issue at a time: two concurrent runs on the same issue would
    # race on the fixed branch name (and waste model spend).
    concurrency:
      group: gemini-agent-${{ github.event.inputs.issue_number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs: a compromised tag would
      # otherwise expose every secret this job holds.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies and Aider
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pre-commit aider-chat

      - name: Prepare Prompt
        id: prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
        run: |
          # workflow_dispatch input is free text and flows into the branch
          # name, title and body: accept digits only.
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo "issue number must be numeric"; exit 1;; esac
          echo "issue_num=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TASK="Issue #${ISSUE_NUMBER}: ${MANUAL_INSTRUCTIONS}"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            TASK="Issue #${ISSUE_NUMBER} (${ISSUE_TITLE}): ${COMMENT_BODY}"
          else
            TASK="Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE} - ${ISSUE_BODY}"
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "task_desc<<${delim}"
            printf '%s\n' "$TASK"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Run Aider with Gemini via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ vars.GEMINI_MODEL || 'openrouter/google/gemini-2.5-pro' }}
          TASK: ${{ steps.prompt.outputs.task_desc }}
        run: |
          git config user.name "gemini-agent[bot]"
          git config user.email "gemini-agent[bot]@users.noreply.github.com"

          # --yes-always confirms every prompt, so shell-command suggestions
          # are disabled outright. Aider's own commits skip git hooks by
          # default; the hygiene step below is the real check.
          aider \
            --model "$MODEL_NAME" \
            --read GEMINI.md \
            --read AGENTS.md \
            --message "Address this task per rules in GEMINI.md/AGENTS.md: $TASK" \
            --auto-commits \
            --no-dirty-check \
            --no-suggest-shell-commands \
            --no-check-update \
            --no-analytics \
            --yes-always

      - name: Enforce repository hygiene and formatting
        id: hygiene
        run: |
          # Deterministic repairs only. Stale vault-note hashes are NOT acked
          # blindly here (an ack asserts the note was compared against the
          # change); they stay red in CI and Gitar's repair instructions
          # (.gitar/instructions/repo-check-repairs.md) handle them.
          girdle index . --inject AGENTS.md
          pre-commit run --all-files || true
          git add -A
          git commit -m "chore: run pre-commit and refresh repo index" || true
          if pre-commit run --all-files; then
            echo "checks=passing" >> "$GITHUB_OUTPUT"
          else
            echo "checks=needs-repair" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the agent's changes as a patch
        id: patch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --binary "origin/${BASE_BRANCH}" HEAD > agent.patch
          if [ -s agent.patch ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: agent-patch
          path: agent.patch
          retention-days: 1

  # Job 2 - publishes. Holds the PR-opening token but never runs the model or
  # any code from the agent's output: it only applies a patch to a clean
  # checkout, after refusing empty patches, oversized patches and any change
  # to workflow files (agent-authored workflow changes need a human).
  publish:
    needs: gemini-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: agent-patch
          path: patch

      - name: Validate the patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ needs.gemini-agent.outputs.issue_num }}
          HAS_CHANGES: ${{ needs.gemini-agent.outputs.has_changes }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fail() {
            msg="$*"
            gh issue comment "$ISSUE_NUM" --body "$msg Run: $RUN_URL"
            echo "$msg"
            exit 1
          }
          if [ "$HAS_CHANGES" != "true" ] || [ ! -s patch/agent.patch ]; then
            fail "The Gemini agent run produced no file changes (the work may" \
              "already exist on the default branch), so no PR was opened."
          fi
          if [ "$(wc -c < patch/agent.patch)" -gt 1000000 ]; then
            fail "The Gemini agent patch is larger than 1 MB, so no PR was opened."
          fi
          # Headers (including renames and copies) that name workflow files.
          hdr='^(diff --git|---|\+\+\+|rename (from|to)|copy (from|to)) '
          if grep -E "$hdr" patch/agent.patch | grep -q '\.github/workflows/'; then
            fail "The Gemini agent patch changes .github/workflows/, which" \
              "agents may not do; no PR was opened."
          fi
          git apply --check patch/agent.patch
          git apply patch/agent.patch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # A fine-grained PAT (contents + pull-requests write only): PRs
          # opened with GITHUB_TOKEN do not trigger CI.
          token: ${{ secrets.AGENT_PR_TOKEN }}
          add-paths: .
          commit-message: "feat: address issue #${{ needs.gemini-agent.outputs.issue_num }}"
          title: "Fix issue #${{ needs.gemini-agent.outputs.issue_num }}"
          body: |
            Automated PR generated by Gemini (via OpenRouter) addressing
            #${{ needs.gemini-agent.outputs.issue_num }}.
            Repo checks at open time: ${{ needs.gemini-agent.outputs.checks }}
            (stale note hashes are repaired in review, not acked blindly).
            Fixes #${{ needs.gemini-agent.outputs.issue_num }}
          branch: "gemini/issue-${{ needs.gemini-agent.outputs.issue_num }}"
          draft: true
          delete-branch: true
