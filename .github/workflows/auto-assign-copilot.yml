name: Auto-assign unblocked issues to Copilot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  pull_request:
    types: [closed]           # faster path: a merge may unblock something

permissions:
  contents: read
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    # For pull_request events only run when the PR was actually merged
    if: github.event_name == 'schedule' || github.event.pull_request.merged == true
    steps:
      - name: Find and assign unblocked issues
        uses: actions/github-script@v9
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          # Bootstrap github-script with the workflow token so the missing-secret
          # warning path can still run before we construct the Copilot client.
          github-token: ${{ github.token }}
          script: |
            if (!process.env.COPILOT_ASSIGN_TOKEN) {
              core.warning(
                "COPILOT_ASSIGN_TOKEN is not configured; skipping Copilot auto-assignment. " +
                "Set a user token with metadata:read plus read/write access to " +
                "actions, contents, issues, and pull requests.",
              );
              return;
            }

            const copilotGitHub = getOctokit(process.env.COPILOT_ASSIGN_TOKEN);
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // ------------------------------------------------------------------
            // 1. Discover the assignable node-id of the copilot-swe-agent
            //    actor via suggestedActors(capabilities: [CAN_BE_ASSIGNED]).
            // ------------------------------------------------------------------
            const repoNodeQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      __typename
                      login
                      ... on Bot { id }
                      ... on User { id }
                      ... on Organization { id }
                      ... on Mannequin { id }
                    }
                  }
                }
              }
            `;
            const copilotHeaders = {
              'GraphQL-Features': [
                'issues_copilot_assignment_api_support',
                'coding_agent_model_selection',
              ].join(','),
            };
            const repoData = await copilotGitHub.graphql(repoNodeQuery, {
              owner, repo, headers: copilotHeaders,
            });
            const suggested = repoData.repository.suggestedActors.nodes;
            const copilotActor = suggested.find(a => a.login === "copilot-swe-agent");
            if (!copilotActor) {
              core.warning("copilot-swe-agent not found in suggestedActors – skipping.");
              return;
            }
            if (!copilotActor.id) {
              core.warning(
                `copilot-swe-agent was returned as ${copilotActor.__typename}` +
                " without an assignable id – skipping.",
              );
              return;
            }
            const copilotId = copilotActor.id;

            core.info(`Copilot actor id: ${copilotId}`);

            // ------------------------------------------------------------------
            // 2. Fetch all open issues (paginate with cursor).
            // ------------------------------------------------------------------
            const statusLabels = [
              "status:blocked",
              "status:ready",
              "status:blocker",
            ];
            const issueQuery = `
              query($owner: String!, $repo: String!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  issues(
                    states: [OPEN]
                    first: 100
                    after: $after
                  ) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id
                      number
                      assignees(first: 1) { totalCount }
                      labels(first: 10, query: "status:") {
                        nodes { name }
                      }
                      blockedBy(first: 100) {
                        nodes { number state }
                        pageInfo { hasNextPage endCursor }
                      }
                      blocking(first: 100) {
                        nodes { number state }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              }
            `;

            let issues = [];
            let after = null;
            while (true) {
              const data = await copilotGitHub.graphql(issueQuery, { owner, repo, after });
              const conn = data.repository.issues;
              issues = issues.concat(conn.nodes);
              if (!conn.pageInfo.hasNextPage) break;
              after = conn.pageInfo.endCursor;
            }

            core.info(`Open issues found: ${issues.length}`);

            // ------------------------------------------------------------------
            // 3. For each open issue, determine blocker state and status labels.
            //    An issue is unblocked when its blockedBy list is empty OR
            //    every issue in it is CLOSED.
            //    If blockedBy itself was truncated (hasNextPage), we must
            //    paginate to avoid missing a real open blocker.
            // ------------------------------------------------------------------
            const blockedByQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    blockedBy(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number state }
                    }
                  }
                }
              }
            `;
            const blockingQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    blocking(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number state }
                    }
                  }
                }
              }
            `;

            const assignMutation = `
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId
                  actorIds: $actorIds
                }) {
                  assignable {
                    ... on Issue { number }
                  }
                }
              }
            `;

            const collectDependencyNodes = async (issueId, connectionName, seedConnection) => {
              let nodes = [...seedConnection.nodes];
              let pageInfo = seedConnection.pageInfo;

              // Paginate if the first page was truncated
              let cursor = seedConnection.pageInfo.endCursor;
              while (pageInfo.hasNextPage) {
                const query = connectionName === "blockedBy" ? blockedByQuery : blockingQuery;
                const more = await copilotGitHub.graphql(query, {
                  id: issueId,
                  after: cursor,
                });
                const conn = more.node[connectionName];
                nodes = nodes.concat(conn.nodes);
                pageInfo = conn.pageInfo;
                cursor = conn.pageInfo.endCursor;
              }
              return nodes;
            };

            const syncStatusLabels = async (issueNumber, currentLabels, desiredLabels) => {
              for (const name of statusLabels) {
                if (desiredLabels.has(name) && !currentLabels.has(name)) {
                  await copilotGitHub.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    labels: [name],
                  });
                  core.info(`Issue #${issueNumber}: added ${name}`);
                }
              }
              for (const name of statusLabels) {
                if (!desiredLabels.has(name) && currentLabels.has(name)) {
                  try {
                    await copilotGitHub.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issueNumber,
                      name,
                    });
                    core.info(`Issue #${issueNumber}: removed ${name}`);
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }
            };

            for (const issue of issues) {
              const blockers = await collectDependencyNodes(
                issue.id,
                "blockedBy",
                issue.blockedBy,
              );
              const blockedIssues = await collectDependencyNodes(
                issue.id,
                "blocking",
                issue.blocking,
              );

              const hasOpenBlocker = blockers.some(b => b.state === "OPEN");
              const isBlockingOpenIssue = blockedIssues.some(b => b.state === "OPEN");
              let isUnassigned = issue.assignees.totalCount === 0;
              if (hasOpenBlocker) {
                const openNums = blockers
                  .filter(b => b.state === "OPEN")
                  .map(b => "#" + b.number)
                  .join(", ");
                core.info(`Issue #${issue.number} still blocked (${openNums})`);
              } else if (isUnassigned) {
                core.info(`Issue #${issue.number} is unblocked – assigning to Copilot`);
                try {
                  await copilotGitHub.graphql(assignMutation, {
                    assignableId: issue.id,
                    actorIds: [copilotId],
                    headers: copilotHeaders,
                  });
                  isUnassigned = false;
                  core.info(`Assigned #${issue.number} to copilot-swe-agent`);
                } catch (err) {
                  const errorMessages = [
                    err.message,
                    ...(Array.isArray(err.errors) ? err.errors.map(e => e?.message) : []),
                    typeof err.data === "string" ? err.data : "",
                  ].filter(Boolean);
                  const errorText = errorMessages.join("\n");
                  const rateLimited = /rate limit/i.test(errorText);
                  const tokenScopeError =
                    (err.status === 403 && !rateLimited) ||
                    errorText.includes("Resource not accessible by personal access token") ||
                    errorText.includes("Resource not accessible by integration");
                  if (tokenScopeError) {
                    // A mis-scoped token will fail every remaining assignment too, so
                    // abort the whole run loudly instead of downgrading it to per-issue noise.
                    throw new Error(
                      "COPILOT_ASSIGN_TOKEN is configured but lacks GitHub's required " +
                      "permissions for Copilot issue assignment " +
                      "(metadata:read plus read/write actions, contents, " +
                      "issues, and pull requests). " +
                      `GitHub responded: ${errorMessages.join(" | ")}`,
                    );
                  }
                  core.warning(`Failed to assign #${issue.number}: ${errorMessages.join(" | ")}`);
                }
              }

              const currentStatusLabels = new Set(issue.labels.nodes.map(l => l.name));
              const desiredStatusLabels = new Set();
              if (hasOpenBlocker) desiredStatusLabels.add("status:blocked");
              if (!hasOpenBlocker && isUnassigned) desiredStatusLabels.add("status:ready");
              if (isBlockingOpenIssue) desiredStatusLabels.add("status:blocker");
              await syncStatusLabels(issue.number, currentStatusLabels, desiredStatusLabels);
            }
