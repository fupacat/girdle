name: Sync issue status and auto-assign Copilot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    env:
      PROJECT_NUMBER: "3"
    steps:
      - name: Sync dependency status and assign unblocked issues
        uses: actions/github-script@v9
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          # Bootstrap github-script with the workflow token so the missing-secret
          # warning path can still run before we construct the Copilot client.
          github-token: ${{ github.token }}
          script: |
            if (!process.env.COPILOT_ASSIGN_TOKEN) {
              core.warning(
                "COPILOT_ASSIGN_TOKEN is not configured; " +
                "skipping issue status sync and Copilot auto-assignment. " +
                "Set a user token with metadata:read plus read/write access to " +
                "actions, contents, issues, pull requests, and repository projects.",
              );
              return;
            }

            const copilotGitHub = getOctokit(process.env.COPILOT_ASSIGN_TOKEN);
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const projectNumber = Number(process.env.PROJECT_NUMBER ?? "0");
            const projectStatusFieldName = "Status";
            const desiredStatusLabels = [
              "status:blocked",
              "status:ready",
              "status:blocker",
            ];

            const errorMessages = (err) => [
              err.message,
              ...(Array.isArray(err.errors) ? err.errors.map(e => e?.message) : []),
              typeof err.data === "string" ? err.data : "",
            ].filter(Boolean);

            const isTokenScopeError = (err) => {
              const messages = errorMessages(err);
              const text = messages.join("\n");
              const rateLimited = /rate limit/i.test(text);
              return (
                (err.status === 403 && !rateLimited) ||
                text.includes("Resource not accessible by personal access token") ||
                text.includes("Resource not accessible by integration")
              );
            };

            const throwScopeError = (operation, err) => {
              throw new Error(
                "COPILOT_ASSIGN_TOKEN is configured but lacks GitHub's required " +
                `permissions for ${operation} ` +
                "(metadata:read plus read/write actions, contents, issues, " +
                "pull requests, and repository projects). " +
                `GitHub responded: ${errorMessages(err).join(" | ")}`,
              );
            };

            if (!Number.isInteger(projectNumber) || projectNumber <= 0) {
              core.warning(
                `PROJECT_NUMBER='${process.env.PROJECT_NUMBER ?? ""}' is invalid; ` +
                "skipping project status sync.",
              );
            }

            // ------------------------------------------------------------------
            // 1. Discover repo metadata needed for assignment, labels, and the
            //    linked repository project board.
            // ------------------------------------------------------------------
            const bootstrapQuery = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) {
                    nodes {
                      __typename
                      login
                      ... on Bot { id }
                      ... on User { id }
                      ... on Organization { id }
                      ... on Mannequin { id }
                    }
                  }
                  labels(first: 100) {
                    nodes {
                      id
                      name
                    }
                  }
                }
              }
            `;
            const projectQuery = `
              query($owner: String!, $projectNumber: Int!) {
                repositoryOwner(login: $owner) {
                  __typename
                  ... on User {
                    projectV2(number: $projectNumber) {
                      id
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                  ... on Organization {
                    projectV2(number: $projectNumber) {
                      id
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const copilotHeaders = {
              'GraphQL-Features': [
                'issues_copilot_assignment_api_support',
                'coding_agent_model_selection',
              ].join(','),
            };
            const bootstrap = await copilotGitHub.graphql(bootstrapQuery, {
              owner,
              repo,
              headers: copilotHeaders,
            });
            let project = null;
            if (projectNumber > 0) {
              try {
                const p = await copilotGitHub.graphql(projectQuery, { owner, projectNumber });
                project = p.repositoryOwner?.projectV2 ?? null;
              } catch (err) {
                project = err.data?.repositoryOwner?.projectV2 ?? null;
                if (isTokenScopeError(err)) throwScopeError("project lookup", err);
              }
            }
            const suggested = bootstrap.repository.suggestedActors.nodes;
            const copilotActor = suggested.find(a => a.login === "copilot-swe-agent");
            const copilotId = copilotActor?.id ?? null;
            if (!copilotActor) {
              core.warning("copilot-swe-agent not found in suggestedActors – skipping assignment.");
            } else if (!copilotId) {
              core.warning(
                `copilot-swe-agent was returned as ${copilotActor.__typename}` +
                " without an assignable id – skipping assignment.",
              );
            }
            const labelIdsByName = new Map(
              bootstrap.repository.labels.nodes.map(label => [label.name, label.id]),
            );
            const statusField =
              project?.fields?.nodes?.find(field => field?.name === projectStatusFieldName) ??
              null;
            const statusOptionIdsByName = new Map(
              (statusField?.options ?? []).map(option => [option.name, option.id]),
            );

            if (copilotId) core.info(`Copilot actor id: ${copilotId}`);
            if (projectNumber > 0 && !project) {
              core.warning(
                `Project #${projectNumber} was not found for ${owner}; ` +
                "skipping project status sync.",
              );
            } else if (projectNumber > 0 && !statusField) {
              core.warning(
                `Project #${projectNumber} is missing a '${projectStatusFieldName}' field; ` +
                "skipping project status sync.",
              );
            }

            // ------------------------------------------------------------------
            // 2. Fetch all open issues (paginate with cursor) so dependency
            //    labels, project Status, and auto-assignment all use the same
            //    snapshot.
            // ------------------------------------------------------------------
            const issueFields = `
              id
              number
              title
              state
              assignees(first: 1) {
                totalCount
              }
              labels(first: 100) {
                nodes {
                  id
                  name
                }
              }
              blockedBy(first: 100) {
                nodes { number state }
                pageInfo { hasNextPage endCursor }
              }
              blocking(first: 100) {
                nodes { number state }
                pageInfo { hasNextPage endCursor }
              }
              closedByPullRequestsReferences(first: 100, includeClosedPrs: true) {
                nodes {
                  number
                  state
                  isDraft
                  commits(last: 1) {
                    nodes {
                      commit {
                        statusCheckRollup {
                          state
                        }
                      }
                    }
                  }
                }
                pageInfo { hasNextPage endCursor }
              }
              projectItems(first: 100) {
                nodes {
                  id
                  project {
                    id
                    number
                  }
                  fieldValueByName(name: "${projectStatusFieldName}") {
                    ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                  }
                }
              }
            `;
            const issueQuery = `
              query($owner: String!, $repo: String!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  issues(
                    states: [OPEN]
                    first: 100
                    after: $after
                  ) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      ${issueFields}
                    }
                  }
                }
              }
            `;
            const issueByNumberQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    ${issueFields}
                  }
                }
              }
            `;
            const blockedByQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    blockedBy(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number state }
                    }
                  }
                }
              }
            `;
            const blockingQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    blocking(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number state }
                    }
                  }
                }
              }
            `;
            const linkedPullRequestsQuery = `
              query($id: ID!, $after: String) {
                node(id: $id) {
                  ... on Issue {
                    closedByPullRequestsReferences(
                      first: 100,
                      after: $after,
                      includeClosedPrs: true
                    ) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        state
                        isDraft
                        commits(last: 1) {
                          nodes {
                            commit {
                              statusCheckRollup {
                                state
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let issuesToProcess = [];
            let after = null;
            while (true) {
              const data = await copilotGitHub.graphql(issueQuery, { owner, repo, after });
              const conn = data.repository.issues;
              issuesToProcess = issuesToProcess.concat(conn.nodes);
              if (!conn.pageInfo.hasNextPage) break;
              after = conn.pageInfo.endCursor;
            }

            if (context.eventName === "issues" && context.payload.action === "closed") {
              const closedIssueNumber = context.payload.issue?.number;
              if (typeof closedIssueNumber === "number") {
                const data = await copilotGitHub.graphql(issueByNumberQuery, {
                  owner,
                  repo,
                  number: closedIssueNumber,
                });
                if (data.repository.issue) {
                  issuesToProcess.push(data.repository.issue);
                }
              }
            }

            const seenIssueIds = new Set();
            issuesToProcess = issuesToProcess.filter(issue => {
              if (seenIssueIds.has(issue.id)) return false;
              seenIssueIds.add(issue.id);
              return true;
            });

            core.info(`Issues to evaluate: ${issuesToProcess.length}`);

            // ------------------------------------------------------------------
            // 3. Helpers for paginated issue connections and GitHub mutations.
            // ------------------------------------------------------------------
            const assignMutation = `
              mutation($assignableId: ID!, $actorIds: [ID!]!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId
                  actorIds: $actorIds
                }) {
                  assignable {
                    ... on Issue { number }
                  }
                }
              }
            `;
            const addLabelsMutation = `
              mutation($labelableId: ID!, $labelIds: [ID!]!) {
                addLabelsToLabelable(input: {
                  labelableId: $labelableId
                  labelIds: $labelIds
                }) {
                  clientMutationId
                }
              }
            `;
            const removeLabelsMutation = `
              mutation($labelableId: ID!, $labelIds: [ID!]!) {
                removeLabelsFromLabelable(input: {
                  labelableId: $labelableId
                  labelIds: $labelIds
                }) {
                  clientMutationId
                }
              }
            `;
            const updateProjectStatusMutation = `
              mutation(
                $projectId: ID!
                $itemId: ID!
                $fieldId: ID!
                $singleSelectOptionId: String!
              ) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $singleSelectOptionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            const addProjectItemMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }
            `;

            const loadConnection = async (initial, query, extract) => {
              let nodes = initial.nodes;
              let pageInfo = initial.pageInfo;
              let cursor = initial.pageInfo.endCursor;
              while (pageInfo.hasNextPage) {
                const more = await copilotGitHub.graphql(query, {
                  id: initial.id,
                  after: cursor,
                });
                const conn = extract(more);
                nodes = nodes.concat(conn.nodes);
                pageInfo = conn.pageInfo;
                cursor = conn.pageInfo.endCursor;
              }
              return nodes;
            };

            const syncLabels = async (issue, desiredLabelNames) => {
              const currentStatusLabelNames = issue.labels.nodes
                .map(label => label.name)
                .filter(name => desiredStatusLabels.includes(name));
              const desiredSet = new Set(desiredLabelNames);
              const currentSet = new Set(currentStatusLabelNames);
              const toAddIds = desiredLabelNames
                .filter(name => !currentSet.has(name))
                .map(name => labelIdsByName.get(name))
                .filter(Boolean);
              const toRemoveIds = currentStatusLabelNames
                .filter(name => !desiredSet.has(name))
                .map(name => labelIdsByName.get(name))
                .filter(Boolean);

              for (const labelName of desiredLabelNames) {
                if (!labelIdsByName.has(labelName)) {
                  core.warning(
                    `Repo label '${labelName}' is missing; skipping for #${issue.number}.`,
                  );
                }
              }

              if (toAddIds.length > 0) {
                await copilotGitHub.graphql(addLabelsMutation, {
                  labelableId: issue.id,
                  labelIds: toAddIds,
                });
              }
              if (toRemoveIds.length > 0) {
                await copilotGitHub.graphql(removeLabelsMutation, {
                  labelableId: issue.id,
                  labelIds: toRemoveIds,
                });
              }
            };

            const syncProjectStatus = async (issue, desiredStatus) => {
              if (!project || !statusField) return;
              let item = issue.projectItems.nodes.find(
                projectItem => projectItem.project.id === project.id,
              );
              if (!item) {
                const result = await copilotGitHub.graphql(addProjectItemMutation, {
                  projectId: project.id,
                  contentId: issue.id,
                });
                const itemId = result.addProjectV2ItemById?.item?.id;
                if (!itemId) {
                  core.warning(
                    `Could not add #${issue.number} to project #${projectNumber}; ` +
                    "skipping status sync.",
                  );
                  return;
                }
                core.info(`Added #${issue.number} to project #${projectNumber}`);
                item = {
                  id: itemId,
                  fieldValueByName: null,
                };
              }
              const optionId = statusOptionIdsByName.get(desiredStatus);
              if (!optionId) {
                core.warning(
                  `Project #${projectNumber} is missing Status option '${desiredStatus}'; ` +
                  `skipping #${issue.number}.`,
                );
                return;
              }
              if (item.fieldValueByName?.optionId === optionId) return;
              await copilotGitHub.graphql(updateProjectStatusMutation, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                singleSelectOptionId: optionId,
              });
              core.info(`Synced #${issue.number} project status to '${desiredStatus}'`);
            };

            const checksPassing = (pullRequest) =>
              pullRequest.commits.nodes[0]?.commit?.statusCheckRollup?.state === "SUCCESS";
            const desiredProjectStatus = (issue, hasOpenBlocker, linkedPullRequests) => {
              if (issue.state !== "OPEN") return "Done";
              if (linkedPullRequests.some(pr => pr.state === "MERGED")) return "Done";
              if (hasOpenBlocker) return "Blocked";
              const activePullRequests = linkedPullRequests.filter(pr => pr.state === "OPEN");
              if (activePullRequests.length === 0) {
                return issue.assignees.totalCount > 0 ? "In Progress" : "Ready";
              }
              if (activePullRequests.some(pr => pr.isDraft || !checksPassing(pr))) {
                return "In Progress";
              }
              return "In Review";
            };

            // ------------------------------------------------------------------
            // 4. Sync dependency labels + project Status, then assign any issue
            //    that is still unblocked, unassigned, and not already tied to an
            //    open PR.
            // ------------------------------------------------------------------
            for (const issue of issuesToProcess) {
              const connectionContext = {
                id: issue.id,
                nodes: issue.blockedBy.nodes,
                pageInfo: issue.blockedBy.pageInfo,
              };
              const blockers = await loadConnection(
                connectionContext,
                blockedByQuery,
                data => data.node.blockedBy,
              );
              const blocking = await loadConnection(
                {
                  id: issue.id,
                  nodes: issue.blocking.nodes,
                  pageInfo: issue.blocking.pageInfo,
                },
                blockingQuery,
                data => data.node.blocking,
              );
              const linkedPullRequests = await loadConnection(
                {
                  id: issue.id,
                  nodes: issue.closedByPullRequestsReferences.nodes,
                  pageInfo: issue.closedByPullRequestsReferences.pageInfo,
                },
                linkedPullRequestsQuery,
                data => data.node.closedByPullRequestsReferences,
              );

              const openBlockers = blockers.filter(b => b.state === "OPEN");
              const openBlocking = blocking.filter(b => b.state === "OPEN");
              const openPullRequests = linkedPullRequests.filter(pr => pr.state === "OPEN");
              const hasOpenBlocker = openBlockers.length > 0;
              const desiredLabels = [];
              if (issue.state === "OPEN") {
                if (hasOpenBlocker) {
                  desiredLabels.push("status:blocked");
                } else if (issue.assignees.totalCount === 0) {
                  desiredLabels.push("status:ready");
                }
                if (openBlocking.length > 0) {
                  desiredLabels.push("status:blocker");
                }
              }

              try {
                await syncLabels(issue, desiredLabels);
                await syncProjectStatus(
                  issue,
                  desiredProjectStatus(issue, hasOpenBlocker, linkedPullRequests),
                );
              } catch (err) {
                if (isTokenScopeError(err)) {
                  throwScopeError("issue status sync", err);
                }
                core.warning(
                  `Failed to sync labels/project status for #${issue.number}: ` +
                  errorMessages(err).join(" | "),
                );
              }

              if (issue.state !== "OPEN") {
                continue;
              }
              if (hasOpenBlocker) {
                const openNums = openBlockers
                  .map(b => "#" + b.number)
                  .join(", ");
                core.info(`Issue #${issue.number} still blocked (${openNums})`);
                continue;
              }
              if (openPullRequests.length > 0) {
                const openPrNums = openPullRequests
                  .map(pr => "#" + pr.number)
                  .join(", ");
                core.info(
                  `Issue #${issue.number} already has open linked PR(s) ` +
                  `(${openPrNums}) – not assigning`,
                );
                continue;
              }
              if (issue.assignees.totalCount > 0) {
                core.info(`Issue #${issue.number} already assigned – not reassigning`);
                continue;
              }
              if (!copilotId) {
                core.info(`Copilot actor unavailable – skipping assignment for #${issue.number}`);
                continue;
              }

              core.info(`Issue #${issue.number} is unblocked – assigning to Copilot`);
              try {
                await copilotGitHub.graphql(assignMutation, {
                  assignableId: issue.id,
                  actorIds: [copilotId],
                  headers: copilotHeaders,
                });
                core.info(`Assigned #${issue.number} to copilot-swe-agent`);
              } catch (err) {
                if (isTokenScopeError(err)) {
                  // A mis-scoped token will fail every remaining assignment too, so
                  // abort the whole run loudly instead of downgrading it to per-issue noise.
                  throwScopeError("Copilot issue assignment", err);
                }
                core.warning(
                  `Failed to assign #${issue.number}: ${errorMessages(err).join(" | ")}`,
                );
              }
            }
