name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud wants full history for accurate new-code analysis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mdformat --check --wrap keep $(git ls-files '*.md')
      - run: yamllint .
      - run: pytest --cov --cov-report=xml
      - run: girdle index . --check AGENTS.md
      - name: vault notes freshness (read-only)
        # The pre-commit hook is the one place auto-reconcile makes sense
        # (it can tell a note apart from the code it watches within a
        # single commit being crafted); here there's no staged/unstaged
        # distinction in a clean checkout, so this only ever verifies -
        # closing the gap where a --no-verify bypass of the local hook
        # would otherwise reach master with nothing checking it.
        run: girdle notes check .
      - name: SonarQube Scan
        # SonarCloud's free plan only analyzes the default branch and PRs, not
        # arbitrary feature-branch pushes; with sonar.qualitygate.wait=true,
        # attempting the latter fails hard ("Not authorized or project not
        # found") instead of silently no-op'ing, so skip it here.
        if: >-
          github.event_name == 'pull_request' ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pages:
    # Publishes the HTML dashboard + a shields.io endpoint-badge JSON so the
    # README badge stays live (shields.io fetches this file on every render)
    # without committing generated content into master's history.
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: mkdir -p public
      - run: girdle dashboard . -o public/index.html
      - run: girdle badge . --json -o public/girdle.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
