name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud wants full history for accurate new-code analysis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov --cov-report=xml
      - run: girdle index . --check AGENTS.md
      - name: SonarQube Scan
        # SonarCloud's free plan only analyzes the default branch and PRs, not
        # arbitrary feature-branch pushes; with sonar.qualitygate.wait=true,
        # attempting the latter fails hard ("Not authorized or project not
        # found") instead of silently no-op'ing, so skip it here.
        if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
