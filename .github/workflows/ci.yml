name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    # Detects a documentation-only PR (every changed file under
    # .agent-vault/ or ending in .md) so the test job below can skip
    # pytest/SonarQube for it - see
    # .agent-vault/ci/documentation-only-queue-design.md. Only meaningful
    # for pull_request events; a push to master always runs everything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: check
        run: |
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -qvE '^(\.agent-vault/|.*\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # needs.changes can be skipped (push event) or fail outright; always()
    # keeps this job running either way - the steps below treat a missing
    # docs_only output as "false" (run everything), which is the safe
    # default if detection ever breaks.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SonarCloud wants full history for accurate new-code analysis
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mdformat --check --wrap keep $(git ls-files '*.md')
      - run: yamllint .
      - name: pytest
        id: tests
        if: needs.changes.outputs.docs_only != 'true'
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        # secrets.MERGIFY_TOKEN resolves to an empty string, not truly
        # unset, when the secret doesn't exist (forks/Dependabot/not yet
        # configured) - unset it here so pytest-mergify sees the same
        # "no token" state verified locally, not an empty one that might
        # be handled differently.
        #
        # Always exits 0 - the CI Insights step below is what actually
        # gates the job. Its own exit code is quarantine-aware (a
        # quarantined flaky test doesn't fail it), which pytest's raw
        # exit code here is not; gating on pytest's own code would defeat
        # the entire point of enabling quarantine. The real exit code is
        # still captured as an output for that step to fall back to.
        run: |
          if [ -z "$MERGIFY_TOKEN" ]; then
            unset MERGIFY_TOKEN
          fi
          set +e
          pytest --cov --cov-report=xml --junitxml=junit.xml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Mergify CI Insights
        # Uploads JUnit results and evaluates quarantine status for flaky
        # tests, then gates the job on ITS exit code (quarantine-aware)
        # rather than pytest's raw one. `if: always()` so it still runs
        # after a pytest failure - the actual case quarantine is for -
        # but `steps.tests.outcome != 'skipped'` excludes the case where
        # an earlier step (ruff/mdformat/yamllint) failed first and
        # pytest never ran at all: outputs.exit_code would be empty
        # there, and `exit ""` is a bash error, not a clean pass/fail.
        # Falls back to pytest's own exit code - real gating, not a
        # silent pass - when there's no token (Dependabot/fork runs never
        # get MERGIFY_TOKEN, same as SONAR_TOKEN below) or junit.xml
        # doesn't exist (pytest can in principle exit without writing one
        # on a crash before collection finishes).
        if: always() && steps.tests.outcome != 'skipped'
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          if [ -z "$MERGIFY_TOKEN" ] || [ ! -f junit.xml ]; then
            exit "${{ steps.tests.outputs.exit_code }}"
          fi
          python -m pip install --quiet mergify-cli
          mergify ci junit-process --test-exit-code "${{ steps.tests.outputs.exit_code }}" junit.xml
      - run: girdle index . --check AGENTS.md
      - name: vault notes freshness (read-only)
        # The pre-commit hook is the one place auto-reconcile makes sense
        # (it can tell a note apart from the code it watches within a
        # single commit being crafted); here there's no staged/unstaged
        # distinction in a clean checkout, so this only ever verifies -
        # closing the gap where a --no-verify bypass of the local hook
        # would otherwise reach master with nothing checking it.
        #
        # Skipped on Mergify's speculative merge-queue branches
        # (mergify/merge-queue/*): the hash comparison there is against
        # the batched/rebased candidate, not any single PR's own diff, so
        # a mismatch there can be caused entirely by another queued PR
        # touching the same watched file - not something this PR (or a
        # human) can fix on that branch. Every real PR branch and push to
        # master still gets the real check; see issue #127 for the false
        # positive this avoids and the planned diff-scoped replacement.
        if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: girdle notes check .
      - name: SonarQube Scan
        # SonarCloud's free plan only analyzes the default branch and PRs, not
        # arbitrary feature-branch pushes; with sonar.qualitygate.wait=true,
        # attempting the latter fails hard ("Not authorized or project not
        # found") instead of silently no-op'ing, so skip it here.
        #
        # GitHub also withholds repo secrets (SONAR_TOKEN included) from
        # workflow runs triggered by Dependabot PRs as a security measure -
        # the token would be blank there regardless of the branch/event
        # check above, so skip explicitly rather than fail on bad auth.
        #
        # Also skipped for documentation-only PRs (see the "changes" job)
        # - nothing in a docs-only diff can change SonarCloud's analysis,
        # and the docs queue's merge_conditions don't require this check.
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          github.actor != 'dependabot[bot]' && (
            github.event_name == 'pull_request' ||
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          )
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pages:
    # Publishes the HTML dashboard + a shields.io endpoint-badge JSON so the
    # README badge stays live (shields.io fetches this file on every render)
    # without committing generated content into master's history.
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mkdir -p public
      - run: girdle dashboard . --run -o public/index.html
      - run: girdle badge . --run --json -o public/girdle.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
