# Zero-exception local checks per the design note's enforcement-hooks
# stance: hooks are deterministic, CLAUDE.md/AGENTS.md are advisory.
# --no-verify still bypasses this - hooks reduce but don't eliminate the
# need for a separate review step (code review / CI), which stays in place.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap, keep]
        additional_dependencies:
          - mdformat-frontmatter==2.1.2
          - mdformat-gfm==1.0.0

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: girdle-index-fresh
        name: girdle index freshness (AGENTS.md)
        entry: girdle index . --check AGENTS.md
        language: system
        pass_filenames: false
        always_run: true

      - id: girdle-notes-check
        name: vault notes staleness (.agent-vault)
        entry: girdle notes check .
        language: system
        pass_filenames: false
        always_run: true
